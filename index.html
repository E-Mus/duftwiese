<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Duftwiese — Chemische Wahrnehmung</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #e9e9e6; }
    canvas { display: block; }
    #info {
      position: fixed;
      left: 16px;
      bottom: 14px;
      z-index: 10;
      color: #444;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px;
      line-height: 1.5;
      pointer-events: none;
      user-select: none;
    }
    #info h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.08em; }
    #info .badge {
      display: inline-block;
      padding: 1px 6px;
      border: 1px solid currentColor;
      border-radius: 3px;
      opacity: 0.7;
    }
    body.dark { background: #0b0d10; }
    body.dark #info { color: #aaa; }
  </style>
</head>
<body>
  <div id="info">
    <h1>DUFTWIESE</h1>
    <div>weiße Pflanzen &middot; sichtbare Düfte &middot; <span class="badge" id="backend">…</span></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
